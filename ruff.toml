# Code style for the experiment scripts (format with: uvx ruff format, check with: uvx ruff check).
line-length = 120
extend-exclude = [
  "experiments/exp04_astra_edit/runs",  # recorded code written by the LLM editors (research data; keep verbatim)
  "*.ipynb",                            # generated by each experiment's make_notebook.py
]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# Kept deliberately: short math names (l, I, O), zip without strict= (changing it could alter behaviour),
# and long lines inside data literals.
ignore = ["E501", "E741", "B905", "SIM300", "SIM115"]
