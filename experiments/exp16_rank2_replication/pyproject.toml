[project]
name = "exp16-rank2-replication"
version = "0.1.0"
description = "Replicate the rank-2 conditioning change on 2WikiMultiHopQA and HotpotQA"
requires-python = ">=3.12,<3.14"
dependencies = [
    "datasets>=4.0",
    "numpy>=1.26",
    "openai>=3.50.0",
    "pandas>=2.2",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.5",
    "tiktoken>=0.8",
    "torch>=2.4",
    "transformers>=4.45",
]

[tool.uv]
package = false
